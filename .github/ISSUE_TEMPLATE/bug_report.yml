name: Bug report
description: Something in the Aeoth Agent desktop application behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste credentials, session logs with personal
        content, or absolute paths from your machine — redact them first.
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: One or two sentences describing the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aeoth Agent version
      description: Shown in the application's About panel, or the release tag you installed.
      placeholder: 0.1.0-preview.4
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.3, MacBook Pro (M3)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it
      options:
        - DMG from the latest release
        - ZIP from the latest release
        - Built from source
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Redacted application output, stack traces, or screenshots that show the problem.
      render: text
    validations:
      required: false
